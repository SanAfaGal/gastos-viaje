<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos de viaje</title>
  <meta name="theme-color" content="#0b6b4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    // Aplica el tema antes de pintar para que no parpadee (la lógica completa está en js/theme.js).
    (function () {
      var r = document.documentElement;
      var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var t = JSON.parse(localStorage.getItem('bg_theme') || '{}');
        if (t.mode === 'dark') dark = true;
        else if (t.mode === 'light') dark = false;
      } catch (e) { /* sin almacenamiento: se queda con el modo del teléfono */ }
      r.dataset.scheme = dark ? 'dark' : 'light';
      // Sin código guardado ni marca de servidor abierto (la misma regla de startsLocked en js/store.js), la barra de
      // pestañas no se pinta: si no, se vería hasta que cargue la app y dibuje la pantalla de acceso.
      try {
        if (!localStorage.getItem('bg_pass') && localStorage.getItem('bg_open') !== '1') r.classList.add('logged-out');
        // Con el código de la administración guardado tampoco: su pantalla no tiene pestañas (la misma clase del router).
        else if (localStorage.getItem('bg_pass') && localStorage.getItem('bg_space') === 'manager') r.classList.add('manager');
      } catch (e) { r.classList.add('logged-out'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/screens.css">
  <!-- Los módulos se piden todos a la vez, en vez de uno detrás de otro según se van importando. -->
  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/ui.js">
  <link rel="modulepreload" href="/js/shared.js">
  <link rel="modulepreload" href="/js/router.js">
  <link rel="modulepreload" href="/js/events.js">
  <link rel="modulepreload" href="/js/view-home.js">
  <link rel="modulepreload" href="/js/view-list.js">
  <link rel="modulepreload" href="/js/view-form.js">
  <link rel="modulepreload" href="/js/view-accounts.js">
  <link rel="modulepreload" href="/js/view-settings.js">
  <link rel="modulepreload" href="/js/view-spaces.js">
  <link rel="modulepreload" href="/js/view-map.js">
  <link rel="modulepreload" href="/js/place-picker.js">
  <link rel="modulepreload" href="/js/store.js">
  <link rel="modulepreload" href="/js/money.mjs">
  <link rel="modulepreload" href="/js/currencies.mjs">
  <link rel="modulepreload" href="/js/settlement.mjs">
  <link rel="modulepreload" href="/js/cards.mjs">
  <link rel="modulepreload" href="/js/chart.mjs">
  <link rel="modulepreload" href="/js/places.mjs">
  <link rel="modulepreload" href="/js/order.mjs">
  <link rel="modulepreload" href="/js/filters.mjs">
  <link rel="modulepreload" href="/js/geolocate.mjs">
  <link rel="modulepreload" href="/js/theme.js">
  <link rel="modulepreload" href="/js/stats.mjs">
  <link rel="modulepreload" href="/js/geosearch.mjs">
  <link rel="modulepreload" href="/js/nearby.mjs">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Inicio</h1>
    <span id="status" class="status" role="status"></span>
    <button id="trip-btn" class="trip-btn" type="button" aria-haspopup="dialog" hidden></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/gastos" data-tab="gastos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Gastos</span></a>
    <a href="#/nuevo" data-tab="nuevo" class="fab" aria-label="Nuevo gasto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/cuentas" data-tab="cuentas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg><span>Cuentas</span></a>
    <a href="#/ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Ajustes</span></a>
  </nav>
  <dialog id="trip-switch" class="sheet" aria-labelledby="ts-title">
    <header class="sheet-head"><h2 id="ts-title">Elige el viaje</h2>
      <button type="button" class="sheet-x" data-close aria-label="Cerrar">×</button></header>
    <div class="sheet-body" id="trip-list" role="radiogroup" aria-labelledby="ts-title"></div>
    <footer class="sheet-foot"><button type="button" class="btn secondary" data-manage>Crear o editar viajes</button></footer>
  </dialog>
  <dialog id="map-pick" class="sheet pick-sheet" aria-labelledby="mp-title">
    <header class="sheet-head"><h2 id="mp-title">Lugar del gasto</h2>
      <span class="head-end"><button type="button" class="info-btn" id="pick-info" aria-haspopup="dialog" aria-label="Más información: formas de encontrar el lugar">i</button>
      <button type="button" class="sheet-x" data-pick-cancel aria-label="Cerrar">×</button></span></header>
    <div class="pick-steps">
      <div class="pick-actions">
        <button type="button" class="pick-here" id="pick-gmaps" aria-label="Paso 1: abrir Google Maps">
          <span class="pick-n" aria-hidden="true">1</span>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Google Maps</span></button>
        <button type="button" class="pick-here" id="pick-paste" aria-label="Paso 2: pegar lo que copiaste">
          <span class="pick-n" aria-hidden="true">2</span>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="8" y="3" width="8" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Pegar</span></button>
        <button type="button" class="pick-here" id="pick-visited" aria-pressed="false" aria-label="Elegir entre los lugares ya visitados">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Visitados</span></button>
      </div>
      <p class="pick-or muted">Busca el lugar en Google Maps, copia el enlace, las coordenadas o el Plus Code y pégalo. O toca el mapa, o elige uno de los lugares ya visitados.</p>
    </div>
    <div id="pick-map" class="map pick" role="region" aria-label="Mapa para elegir el lugar"></div>
    <div id="pick-panel" class="pick-panel"></div>
    <footer class="sheet-foot pick-foot">
      <div class="pick-sel" id="pick-sel" aria-live="polite"></div>
      <button type="button" class="btn" id="pick-ok" disabled>Usar este lugar</button>
    </footer>
  </dialog>
  <dialog id="pick-help" class="sheet info" aria-labelledby="pick-help-t">
    <header class="sheet-head"><h2 id="pick-help-t">Formas de encontrar el lugar</h2>
      <button type="button" class="sheet-x" data-help-close aria-label="Cerrar">×</button></header>
    <div class="sheet-body" id="pick-help-body"></div>
  </dialog>
  <div id="toast" class="toast"></div>
  <div id="live-status" class="sr-only" role="status"></div>
  <div id="live-alert" class="sr-only" role="alert"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
