<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos de viaje</title>
  <meta name="theme-color" content="#0b6b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    // Aplica el tema antes de pintar para que no parpadee (la lógica completa está en js/theme.js).
    (function () {
      var r = document.documentElement;
      var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var t = JSON.parse(localStorage.getItem('bg_theme') || '{}');
        if (t.mode === 'dark') dark = true;
        else if (t.mode === 'light') dark = false;
        if (t.accent) r.dataset.accent = t.accent;
      } catch (e) { /* sin almacenamiento: se queda con el modo del teléfono */ }
      r.dataset.scheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Inicio</h1>
    <span id="status" class="status" role="status"></span>
    <button id="trip-btn" class="trip-btn" type="button" aria-haspopup="dialog" hidden></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/gastos" data-tab="gastos"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Gastos</span></a>
    <a href="#/nuevo" data-tab="nuevo" class="fab" aria-label="Nuevo gasto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/cuentas" data-tab="cuentas"><svg viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg><span>Cuentas</span></a>
    <a href="#/ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Ajustes</span></a>
  </nav>
  <dialog id="trip-switch" class="sheet" aria-labelledby="ts-title">
    <header class="sheet-head"><h2 id="ts-title">Elige el viaje</h2>
      <button type="button" class="sheet-x" data-close aria-label="Cerrar">×</button></header>
    <div class="sheet-body" id="trip-list" role="radiogroup" aria-labelledby="ts-title"></div>
    <footer class="sheet-foot"><button type="button" class="btn secondary" data-manage>Crear o editar viajes</button></footer>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
