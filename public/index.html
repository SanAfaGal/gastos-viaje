<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos de viaje</title>
  <meta name="theme-color" content="#0b6b4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    // Aplica el tema antes de pintar para que no parpadee (la lógica completa está en js/theme.js).
    (function () {
      var r = document.documentElement;
      var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var t = JSON.parse(localStorage.getItem('bg_theme') || '{}');
        if (t.mode === 'dark') dark = true;
        else if (t.mode === 'light') dark = false;
      } catch (e) { /* sin almacenamiento: se queda con el modo del teléfono */ }
      r.dataset.scheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Los módulos se piden todos a la vez, en vez de uno detrás de otro según se van importando. -->
  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/store.js">
  <link rel="modulepreload" href="/js/money.mjs">
  <link rel="modulepreload" href="/js/currencies.mjs">
  <link rel="modulepreload" href="/js/settlement.mjs">
  <link rel="modulepreload" href="/js/cards.mjs">
  <link rel="modulepreload" href="/js/chart.mjs">
  <link rel="modulepreload" href="/js/places.mjs">
  <link rel="modulepreload" href="/js/order.mjs">
  <link rel="modulepreload" href="/js/theme.js">
  <link rel="modulepreload" href="/js/stats.mjs">
  <link rel="modulepreload" href="/js/geosearch.mjs">
  <link rel="modulepreload" href="/js/nearby.mjs">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Inicio</h1>
    <span id="status" class="status" role="status"></span>
    <button id="trip-btn" class="trip-btn" type="button" aria-haspopup="dialog" hidden></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/gastos" data-tab="gastos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Gastos</span></a>
    <a href="#/nuevo" data-tab="nuevo" class="fab" aria-label="Nuevo gasto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/cuentas" data-tab="cuentas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg><span>Cuentas</span></a>
    <a href="#/ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Ajustes</span></a>
  </nav>
  <dialog id="trip-switch" class="sheet" aria-labelledby="ts-title">
    <header class="sheet-head"><h2 id="ts-title">Elige el viaje</h2>
      <button type="button" class="sheet-x" data-close aria-label="Cerrar">×</button></header>
    <div class="sheet-body" id="trip-list" role="radiogroup" aria-labelledby="ts-title"></div>
    <footer class="sheet-foot"><button type="button" class="btn secondary" data-manage>Crear o editar viajes</button></footer>
  </dialog>
  <dialog id="map-pick" class="sheet pick-sheet" aria-labelledby="mp-title">
    <header class="sheet-head"><h2 id="mp-title">Lugar del gasto</h2>
      <button type="button" class="sheet-x" data-pick-cancel aria-label="Cerrar">×</button></header>
    <form id="pick-search" class="pick-search" role="search" autocomplete="off">
      <input id="pick-q" type="search" enterkeyhint="search" maxlength="120" placeholder="Buscar lugar o dirección" aria-label="Buscar un lugar por nombre">
      <button type="button" class="pick-here" id="pick-here" aria-label="Usar mi ubicación">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="pick-here-t">Mi ubicación</span></button>
    </form>
    <div id="pick-map" class="map pick" role="region" aria-label="Mapa para elegir el lugar"></div>
    <div id="pick-panel" class="pick-panel"></div>
    <footer class="sheet-foot pick-foot">
      <div class="pick-sel" id="pick-sel" aria-live="polite"></div>
      <button type="button" class="btn" id="pick-ok" disabled>Usar este lugar</button>
    </footer>
  </dialog>
  <div id="toast" class="toast"></div>
  <div id="live-status" class="sr-only" role="status"></div>
  <div id="live-alert" class="sr-only" role="alert"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
